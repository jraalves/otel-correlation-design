# loki-config.yaml — Loki em single-binary, storage local, retenção curta.
#
# Papel no lab: receber os logs que o Collector exporta por OTLP e permitir a
# consulta pela chave de negócio (`correlation_id`), que é o que fecha o ciclo
# trace -> log -> métrica na travessia de fronteira.
#
# Nota de projeto: `correlation_id` aqui é ATRIBUTO/CONTEÚDO, nunca label de
# stream. Label de stream com cardinalidade alta destrói o índice. A consulta é
# `| json | correlation_id="..."`, não `{correlation_id="..."}`.
#
# Referência: https://grafana.com/docs/loki/latest/setup/install/docker/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

limits_config:
  retention_period: 24h
  retention_enabled: true
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_streams_per_user: 10000
  # Publica resource attributes como labels de stream. É o que faz
  # {service_name="fronteira-transacional"} funcionar no painel deste lab.
  loki_resource_attributes_as_tags: true
  volume_enabled: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
