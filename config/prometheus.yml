# prometheus.yml — scrape das duas fontes do lab.
#
# Duas fontes, dois caminhos, de propósito:
#   * `otlp-exportadas`   : app -> Collector -> exporter Prometheus (:8889). PUSH.
#     É onde nascem as séries `sre_jornada_duration_seconds*` e
#     `sre_fronteira_relogio_skew_seconds*` usadas pelo dashboard.
#   * `fronteira-transacional`: o simulador de sistema transacional expõe /metricos
#     em texto Prometheus, sem SDK, sem OTel. É o caminho realista para um sistema
#     que não vai receber instrumentação nativa nunca.
#
# Validação: promtool check config config/prometheus.yml
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    lab: otel-correlation
    ambiente: lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector-interno
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector

  # Caminho PUSH: métricas OTLP convertidas pelo Collector.
  - job_name: otlp-exportadas
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: api-gateway
          caminho: push-otel
          team: sre-observabilidade
    metric_relabel_configs:
      # Mantém só o que o desenho do lab define. Sem essa lista, qualquer métrica
      # nova de SDK entra no TSDB e a primeira coisa que quebra é a cardinalidade.
      - source_labels: [__name__]
        regex: "sre_jornada_duration_seconds.*|sre_fronteira_relogio_skew_seconds.*|target_info|scrape_samples_scraped"
        action: keep

  # Fronteira sem tracing nativo: texto Prometheus exposto por um sidecar stdlib.
  - job_name: fronteira-transacional
    metrics_path: /metricos
    scheme: http
    static_configs:
      - targets: ["fronteira-transacional:8090"]
        labels:
          service: fronteira-transacional
          camada: legado
          caminho: scrape-nativo
          team: sre-observabilidade

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki
